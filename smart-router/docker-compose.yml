services:
  router:
    build: .
    ports: ["127.0.0.1:8080:8080"]     # this computer only; set ROUTER_TOKEN before exposing it further
    env_file: .env
    volumes:
      - router-data:/data              # learned routing scores + cache survive restarts
      - ./config:/app/config:ro        # edit models.yaml without rebuilding
      - ./skills:/app/skills:ro
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
volumes:
  router-data:
