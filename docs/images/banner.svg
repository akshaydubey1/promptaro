<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Promptaro: free AI for every task">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101b33"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="zero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <!-- routing motif: one request fanning out to models -->
  <g stroke-linecap="round" fill="none" stroke-width="3" opacity="0.9">
    <path d="M920 180 C 990 180, 1010 110, 1090 110" stroke="#4ade80"/>
    <path d="M920 180 C 990 180, 1010 180, 1090 180" stroke="#7dd3fc"/>
    <path d="M920 180 C 990 180, 1010 250, 1090 250" stroke="#a78bfa" stroke-dasharray="6 9" opacity="0.6"/>
  </g>
  <circle cx="912" cy="180" r="14" fill="#e2e8f0"/>
  <circle cx="912" cy="180" r="24" fill="none" stroke="#e2e8f0" stroke-opacity="0.25" stroke-width="2"/>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="1098" y="92" width="132" height="36" rx="18" fill="#052e1a" stroke="#4ade80"/>
    <text x="1164" y="116" text-anchor="middle" fill="#4ade80">Free models</text>
    <rect x="1098" y="162" width="132" height="36" rx="18" fill="#082233" stroke="#7dd3fc"/>
    <text x="1164" y="186" text-anchor="middle" fill="#7dd3fc">Your plan</text>
    <rect x="1098" y="232" width="132" height="36" rx="18" fill="#1b1435" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="1164" y="256" text-anchor="middle" fill="#a78bfa" fill-opacity="0.75">Paid: off</text>
  </g>

  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <text x="72" y="92" font-size="20" font-weight="600" letter-spacing="4" fill="#94a3b8">FREE AI FOR EVERY TASK</text>
    <text x="68" y="182" font-size="96" font-weight="800" fill="url(#word)">Promptaro</text>
    <text x="72" y="232" font-size="26" fill="#cbd5e1">Chat, code and agents on free tokens and your own plan.</text>
    <g font-size="20" font-weight="600">
      <rect x="72" y="262" width="212" height="44" rx="22" fill="url(#zero)"/>
      <text x="178" y="291" text-anchor="middle" fill="#04210f">$0 by default</text>
      <rect x="298" y="262" width="250" height="44" rx="22" fill="none" stroke="#475569"/>
      <text x="423" y="291" text-anchor="middle" fill="#e2e8f0">Free tokens first</text>
      <rect x="562" y="262" width="270" height="44" rx="22" fill="none" stroke="#475569"/>
      <text x="697" y="291" text-anchor="middle" fill="#e2e8f0">Mac · Windows · Linux</text>
    </g>
  </g>
</svg>
